
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Style.css">

    <title>Calculator</title>
</head>

<body>

    <div class="calculator">

        <!-- Display Screen -->
        <input
            type="text"
            placeholder="0"
            id="inputbox"
            readonly
            aria-label="Calculator display"
        >

        <!-- Calculator Buttons -->
        <div class="buttons">

            <button type="button" class="operator1" data-action="clear">AC</button>
            <button type="button" class="operator1" data-action="delete">DEL</button>
            <button type="button" class="operator" data-value="%">%</button>
            <button type="button" class="operator" data-value="/">/</button>

            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" class="operator" data-value="*">*</button>

            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" class="operator" data-value="-">-</button>

            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" class="operator" data-value="+">+</button>

            <button type="button" data-value="00">00</button>
            <button type="button" data-value="0">0</button>
            <button type="button" data-value=".">.</button>
            <button type="button" class="equalbtn" data-action="calculate">=</button>

        </div>

    </div>

    <script src="Script.js"></script>

</body>
</html>
